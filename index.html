<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Grinder WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background: #12100e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
        }

        /* ШАПКА В СТИЛЕ ТЮРЯГИ */
        .top-hud {
            background: #231f1e;
            border: 3px solid #000;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 0 #000;
            gap: 6px;
        }

        .user-mini-profile {
            display: flex;
            flex-direction: column;
            background: #2e2826;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 4px 8px;
            min-width: 110px;
        }

        .user-name {
            font-size: 11px;
            font-weight: 900;
            color: #facc15;
        }

        .user-lvl-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .user-lvl-text {
            font-size: 9px;
            font-weight: 800;
            color: #a8a29e;
        }

        .mini-exp-bar {
            flex: 1;
            background: #1c1917;
            border: 1.5px solid #000;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .mini-exp-fill {
            background: #38bdf8;
            height: 100%;
            width: 30%;
        }

        .resources-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .res-badge {
            background: #2e2826;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 900;
            box-shadow: 0 2px 0 #000;
        }

        /* ОСНОВНОЙ ИГРОВОЙ ЭКРАН (КАК В РЕФЕРЕНСЕ) */
        .main-game-stage {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 6px;
            margin: 6px 0;
            max-height: calc(100vh - 160px);
        }

        /* Центр: Камера / Койка с персонажем */
        .cell-room {
            background: #1a1716;
            border: 3px solid #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 3px 0 #000;
        }

        .brick-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(40,30,25,0.6) 0%, rgba(10,8,7,0.9) 100%);
        }

        .bed-and-hero {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Нижняя панель действий в камере (как внизу референса) */
        .cell-actions-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20, 17, 15, 0.95);
            border-top: 3px solid #000;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .action-tool-icon {
            width: 36px;
            height: 36px;
            background: #2e2826;
            border: 2px solid #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 0 #000;
            cursor: pointer;
        }

        .cell-dialogue {
            font-size: 11px;
            font-weight: 800;
            color: #d6d3d1;
            text-align: center;
            padding: 0 6px;
        }

        /* Правая панель локаций и таймеров (как справа в референсе) */
        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .locations-box {
            background: #231f1e;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 3px 0 #000;
        }

        .loc-btn {
            background: #2e2826;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 0 #000;
        }
        .loc-btn:active { transform: translateY(2px); box-shadow: none; }

        .timers-box {
            background: #231f1e;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 3px 0 #000;
            overflow-y: auto;
            max-height: 180px;
        }

        .timer-card {
            background: #2e2826;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            font-weight: 900;
        }
        .timer-card span { color: #facc15; font-size: 10px; margin-top: 1px; }

        /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (В СТИЛЕ ТЮРЯГИ) */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .nav-tab-btn {
            background: linear-gradient(180deg, #f97316 0%, #c2410c 100%);
            color: #000;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 8px 4px;
            font-weight: 900;
            font-size: 11px;
            text-align: center;
            box-shadow: 0 3px 0 #000;
            cursor: pointer;
            text-transform: uppercase;
        }
        .nav-tab-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000;
        }

        /* Экраны контента */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .screen.active { display: flex; }

        /* Всплывающие уведомления */
        .floating-num {
            position: fixed;
            font-size: 24px;
            font-weight: 900;
            color: #ef4444;
            -webkit-text-stroke: 1.5px #000;
            z-index: 3000;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.1); }
        }
    </style>
</head>
<body>

    <!-- ШАПКА В СТИЛЕ ТЮРЯГИ -->
    <div class="top-hud">
        <div class="user-mini-profile">
            <span class="user-name" id="userName">Выживший</span>
            <div class="user-lvl-row">
                <span class="user-lvl-text" id="userLvlText">Ур. 1</span>
                <div class="mini-exp-bar"><div class="mini-exp-fill" id="expFill"></div></div>
            </div>
        </div>

        <div class="resources-row">
            <div class="res-badge" title="Авторитет"><span>✊</span><span id="authHeader">0</span></div>
            <div class="res-badge" title="Энергия"><span>⚡</span><span id="energyHeader">100</span></div>
            <div class="res-badge" title="Спички"><span>🔥</span><span id="matchHeader">0</span></div>
            <div class="res-badge" title="Мыло"><span>🧼</span><span id="soapHeader">0</span></div>
            <div class="res-badge" title="Тушенка"><span>🥫</span><span id="tushHeader">0</span></div>
        </div>

        <button class="settings-btn" onclick="alert('Настройки')">⚙️</button>
    </div>

    <!-- ЭКРАН 1: КАМЕРА / ИГРОВАЯ ЗОНА (ОХОТА) -->
    <div class="screen active" id="screen-game">
        <div class="main-game-stage">
            <!-- Центр с койкой и персонажем -->
            <div class="cell-room" id="zombieClickZone">
                <div class="brick-bg"></div>
                <div class="bed-and-hero">
                    <!-- Здесь кукла персонажа или зомби -->
                    <div style="font-size: 80px; text-align: center; filter: drop-shadow(0 6px 0 #000);">🧟‍♂️</div>
                </div>

                <div class="cell-actions-bar">
                    <div class="action-tool-icon" title="Заточка" onclick="useTool('shiv')">🔪</div>
                    <div class="cell-dialogue" id="dialogueText">Зомби рвутся к дверям бункера! Бей их!</div>
                    <div class="action-tool-icon" title="Расходники" onclick="openMarketModal()">🎒</div>
                </div>
            </div>

            <!-- Правая колонка: Локации и таймеры вылазок -->
            <div class="right-sidebar">
                <div class="locations-box">
                    <div style="font-size: 10px; font-weight: 900; color: #a8a29e; text-align: center; margin-bottom: 2px;">ЛОКАЦИИ</div>
                    <div class="loc-btn" onclick="switchTab('bosses')">💀 Рейд на Боссов</div>
                    <div class="loc-btn" onclick="switchTab('market')">📦 Лаки Боксы</div>
                    <div class="loc-btn" onclick="switchTab('shop')">🛠️ Мастерская</div>
                </div>

                <div class="timers-box">
                    <div style="font-size: 9px; font-weight: 900; color: #a8a29e; text-align: center;">ВЫЛАЗКИ</div>
                    <div class="timer-card">
                        <span>Зачистка двора</span>
                        <span id="timer1">12:45:10</span>
                    </div>
                    <div class="timer-card">
                        <span>Схрон у забора</span>
                        <span id="timer2">01:20:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <div class="bottom-nav">
        <div class="nav-tab-btn" onclick="switchTab('game')">🏠 Бункер</div>
        <div class="nav-tab-btn" onclick="switchTab('bosses')">💀 Боссы</div>
        <div class="nav-tab-btn" onclick="switchTab('market')">📦 Рынок</div>
        <div class="nav-tab-btn" onclick="switchTab('shop')">🚀 База</div>
    </div>

    <script>
        // Игровая логика в стиле Тюряги + Зомби-апокалипсис
        let matches = 0;
        let soap = 0;
        let tushonka = 0;
        let authority = 0;
        let energy = 100;
        let maxEnergy = 100;

        const clickZone = document.getElementById('zombieClickZone');
        clickZone.addEventListener('pointerdown', (e) => {
            if (energy <= 0) {
                alert('Нужна энергия! Выпей кофе ☕');
                return;
            }
            energy--;
            let earned = Math.floor(Math.random() * 5) + 1;
            matches += earned;

            showFloating(e.clientX, e.clientY, `+${earned} 🔥`);
            updateHUD();
        });

        function showFloating(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-num';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function updateHUD() {
            document.getElementById('matchHeader').innerText = matches;
            document.getElementById('soapHeader').innerText = soap;
            document.getElementById('tushHeader').innerText = tushonka;
            document.getElementById('authHeader').innerText = authority;
            document.getElementById('energyHeader').innerText = `${energy}/${maxEnergy}`;
        }

        function switchTab(tab) {
            // Переключение экранов (базовая заглушка для навигации)
            if(tab === 'market') {
                alert('Открываем рынок с Лаки Боксами и кофе!');
            } else if(tab === 'bosses') {
                alert('Переход к списку боссов (таймер 2 часа)!');
            } else if(tab === 'shop') {
                alert('Улучшения базы и мастерская!');
            }
        }

        function useTool(tool) {
            alert('Использована заточка против орды зомби!');
        }

        function openMarketModal() {
            alert('Открытие инвентаря расходников');
        }

        updateHUD();
    </script>
</body>
</html>
